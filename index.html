<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDrop - Bridge the Gap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Add this to keep animations smooth */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
    </style>
</head>
<body class="bg-gray-100 text-slate-900 min-h-screen transition-colors duration-500">

    <!-- 1. Welcome Overlay -->
    <div id="welcomeOverlay" class="hidden fixed inset-0 bg-blue-600 z-[100] flex items-center justify-center text-white">
        <div class="text-center animate-pulse">
            <h1 class="text-6xl font-black mb-4">DevDrop</h1>
            <p class="text-xl italic">"Bridging the gap between university ambition and industrial innovation."</p>
        </div>
    </div>

    <!-- 2. Login Page -->
    <div id="loginPage" class="flex items-center justify-center h-screen">
        <div class="bg-white p-8 rounded-xl shadow-xl w-96 border border-gray-200">
            <h2 class="text-2xl font-bold mb-6 text-slate-900">DevDrop Login</h2>
            <select id="roleSelect" class="w-full bg-white border border-gray-300 p-2 rounded mb-4 text-blue-900 font-semibold focus:outline-none focus:border-blue-500">
                <option value="student">Login as Student</option>
                <option value="industrialist">Login as Industrialist</option>
            </select>
            <button onclick="handleLogin()" class="w-full bg-blue-600 py-2 rounded font-bold text-white hover:bg-blue-700 transition">Login</button>
        </div>
    </div>

    <!-- 3. Main App -->
    <div id="appContainer" class="hidden">
        <nav id="navBar" class="bg-slate-800 p-4 flex justify-between items-center border-b border-slate-700 text-white"></nav>
        <main id="pageContent" class="max-w-6xl mx-auto p-6 animate-fade-in"></main>
    </div>

    <!-- 4. Modals -->
    <!-- Submit Modal -->
    <div id="submitModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl w-96 text-slate-900 shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Submit Proposal</h3>
            <textarea id="solutionLink" class="w-full border p-2 rounded mb-4" placeholder="Paste link..."></textarea>
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 bg-gray-300 py-2 rounded">Cancel</button>
                <button onclick="submitProject()" class="flex-1 bg-blue-600 py-2 rounded text-white font-bold">Send</button>
            </div>
        </div>
    </div>

    <!-- Post Modal -->
    <div id="postModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl w-[500px] text-slate-900 shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Post New Challenge</h3>
            <input type="text" id="projTitle" class="w-full border p-2 rounded mb-3" placeholder="Project Title">
            <textarea id="projDesc" class="w-full border p-2 rounded mb-3" placeholder="Project Description"></textarea>
            <input type="text" id="projSkills" class="w-full border p-2 rounded mb-3" placeholder="Skills Required (e.g. Python, AI)">
            <div class="flex gap-2">
                <button onclick="document.getElementById('postModal').classList.add('hidden')" class="flex-1 bg-gray-300 py-2 rounded">Cancel</button>
                <button onclick="postChallenge()" class="flex-1 bg-blue-600 py-2 rounded text-white font-bold">Post to Platform</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
